<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatoire du Foncier - SICOVAL</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Mon style perso -->
  <link rel="stylesheet" href="Style.css" />
</head>
<body>

  <div id="app-container" style="display: flex; height: 100vh;">
    
    <!-- PANNEAU LATÉRAL (SIDEBAR) -->
    <div id="sidebar">

      <div class="form-group">
        <label for="theme-select">Mode d'analyse :</label>
        <select id="theme-select"></select>
      </div>

      <div class="form-group">
        <label for="commune-select">Commune :</label>
        <select id="commune-select">
          <option value="">-- SICOVAL (Ensemble) --</option>
        </select>
      </div>
      <div id="wrapper-periode" class="form-group">
        <label for="periode-select">Choisir une période :</label>
        <select id="periode-select"></select>
      </div>

      <div id="wrapper-destination" class="form-group">
        <label for="destination-select">Destination :</label>
        <select id="destination-select">
          <option value="TOUT">Toutes les destinations</option>
          <option value="LOGEMENTS">Habitation</option>
          <option value="ACTIVITES_EQUIPEMENTS">Activités / Équipements</option>
        </select>
      </div>
      <!-- Dans sidebar (index.html) -->
      <button id="btn-reset">Réinitialiser les filtres</button>
      <!-- Boutons d'export dans la sidebar -->
      <button id="btn-export-svg">
        Exporter en SVG (Vectoriel) 
        <span class="info-bulle" title="Format vectoriel idéal pour la modification graphique dans un logiciel de déssin.">ℹ️</span>
      </button>

      <button id="btn-export-png">
        Exporter en PNG (Image) 
        <span class="info-bulle" title="Format image standard, parfait pour l'insertion rapide dans des rapports ou diaporamas.">ℹ️</span>
      </button>

      <button id="btn-export-excel">
        Exporter le tableau en Excel 
        <span class="info-bulle" title="Format tableur (.xlsx) reprenant l'intégralité des données chiffrées affichées dans le tableau récapitulatif.">ℹ️</span>
      </button>


      <div id="sidebar-recap-container">
        <!-- Contenu du panneau latéral -->
      </div>
      <div class="form-group" style="margin-top: 15px;">
  <button id="btn-afficher-definition" class="btn-definition">📄 Afficher la documentation du thème</button>
</div>
    </div>

    <!-- CARTE LEAFLET -->
    <div id="map" style="flex: 1; height: 100%;">

    </div>
    <div id="modal-definition" class="modal-overlay" style="display: none;">
    <div class="modal-content-carre">
      <button id="btn-fermer-modal" class="modal-close">&times;</button>
      <h3 id="modal-title">Définition du thème</h3>
      <div id="pdf-container">
        <object id="pdf-viewer" data="" type="application/pdf" width="100%" height="100%">
          <p>Votre navigateur ne peut pas afficher ce PDF. <a id="pdf-fallback-link" href="" target="_blank">Télécharger le PDF</a>.</p>
        </object>
      </div>
    </div>
  </div>

  </div>

  <!-- INCLUSION DES SCRIPTS JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <!-- 1. Données GeoJSON (fichiers de données) -->
  <!-- <script src="Data/Enaf2022.js"></script>
  <script src="Data/ConsoEnaf0922vf.js"></script>
  <script src="Data/Sicoval_SCEP_vf.js"></script>
  <script src="Data/CommunesSico.js"></script>
  <script src="Data/ConsoPlanifieevf.js"></script> -->

  <!-- <script src="data/EnafPlanifieeData.js"></script>
  <script src="data/PotentielDensifData.js"></script> -->

  <!-- 2. Scripts applicatifs (L'ordre est important) -->
  <script src="js/util.js"></script>
  <script src="js/calcul.js"></script>
  <script src="js/map.js"></script>
  <script src="js/themesConfig.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
